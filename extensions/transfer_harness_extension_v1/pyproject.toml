[build-system]
requires = []
build-backend = "backend"
backend-path = ["."]

[project]
name = "agentic-transfer-verifier-harness-extension"
version = "1.0.0"
description = "Operator-approved digest-only Harness extension for Agentic Transfer Verifier."
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Dmitry Krivonosov" }]
dependencies = []

[project.entry-points."agentic_security_harness.extensions.v1"]
"agentic-transfer-verifier.verification" = "agentic_transfer_verifier_extension:build_extension"

[tool.agentic-security-harness]
future-package-boundary = ">=1.3,<2"
api = "1"
discovery = "explicit-operator-selection-only"
operational-authority = "none"
